name: Build OpenEUICC

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openeuicc-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone locked source
        run: bash scripts/prepare-source.sh source
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-37.0' 'ndk;26.1.10909125' 'build-tools;36.0.0'
      - name: Run tests and build signed APKs and Magisk module
        working-directory: source
        env:
          PATCH_BOOTSTRAP: ${{ secrets.OPENEUICC_CUSTOMIZE_SCRIPT }}
        run: |
          set +x
          : "${PATCH_BOOTSTRAP:?Set OPENEUICC_CUSTOMIZE_SCRIPT}"
          umask 077
          export SOURCE="$PWD"
          export KV_LOADER="$GITHUB_WORKSPACE/scripts/run-kv-loader.cjs"
          SIGNING_DIR=$(mktemp -d "$RUNNER_TEMP/openeuicc-signing.XXXXXX")
          export SIGNING_DIR
          trap 'rm -f "$SOURCE/keystore.properties"; rm -rf "$SIGNING_DIR"' EXIT
          printf '%s\n' "$PATCH_BOOTSTRAP" > "$SIGNING_DIR/bootstrap.sh"
          unset PATCH_BOOTSTRAP
          bash "$SIGNING_DIR/bootstrap.sh"
          rm "$SIGNING_DIR/bootstrap.sh"
          test -s keystore.properties
          test -s "$SIGNING_DIR/app.keystore"
          ./gradlew --no-daemon test :app:assembleReleaseMagiskModule :app-unpriv:assembleRelease
      - name: Verify and stage artifacts
        run: |
          mkdir dist
          cp source/app/build/outputs/apk/release/app-release.apk dist/OpenEUICC-release.apk
          cp source/app-unpriv/build/outputs/apk/release/app-unpriv-release.apk dist/EasyEUICC-release.apk
          cp source/app/build/magisk/magisk-release.zip dist/OpenEUICC-Magisk-release.zip
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          done
          module=dist/OpenEUICC-Magisk-release.zip
          unzip -t "$module"
          unzip -p "$module" system/system_ext/priv-app/OpenEUICC/OpenEUICC.apk | cmp dist/OpenEUICC-release.apk -
          unzip -p "$module" system/system_ext/etc/permissions/privapp_whitelist_im.angry.openeuicc.xml |
            cmp source/privapp_whitelist_im.angry.openeuicc.xml -
          (
            cd dist
            sha256sum *.apk *.zip > SHA256SUMS
          )
          cp sources.lock.json dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenEUICC-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenEUICC-${{ github.sha }}
          path: dist
      - name: Publish verified APKs and Magisk module
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          tag="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "OpenEUICC build $GITHUB_RUN_NUMBER (attempt $GITHUB_RUN_ATTEMPT)" \
            --notes "Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." \
            dist/OpenEUICC-release.apk dist/EasyEUICC-release.apk \
            dist/OpenEUICC-Magisk-release.zip dist/SHA256SUMS dist/sources.lock.json
